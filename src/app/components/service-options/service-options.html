<ul class="service-options">
  @for (option of service().options; track option.id) {
    <li class="service-options__row">
      <span class="service-options__name">{{ option.name }}</span>

      <span class="service-options__stepper">
        <button
          type="button"
          class="service-options__button"
          [disabled]="budget.quantityOf(service().id, option.id) <= option.min"
          [attr.aria-label]="'Menys ' + option.name"
          (click)="budget.decrease(service().id, option.id)"
        >
          −
        </button>

        <output class="service-options__quantity" [attr.aria-label]="option.name">
          {{ budget.quantityOf(service().id, option.id) }}
        </output>

        <button
          type="button"
          class="service-options__button"
          [attr.aria-label]="'Més ' + option.name"
          (click)="budget.increase(service().id, option.id)"
        >
          +
        </button>
      </span>
    </li>
  }
</ul>
